[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nxml"
version = "1.0.12"
description = "Executeable Machine Learning"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bjoern Salgert", email = "bjoern.salgert@hs-duesseldorf.de" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "usersettings>=1.0.7",
    "docker",
    "ollama",
]

[project.optional-dependencies]
rag = ["numpy"]
rag-hugging = ["numpy", "sentence-transformers"]
rag-postgres = ["numpy", "psycopg[binary]"]
rag-qdrant = ["numpy", "qdrant-client"]

[project.urls]
Homepage = "https://bsnx.net/4.0/group/pynwebclient"

[project.entry-points.nweb_runner]
nlp = "nxml.analyse:NlpPipeline"
toxity = "nxml.analyse:Toxity"
flair = "nxml.analyse:FlairRunner"
bert = "nxml.analyse:BertEmbeddings"
text_embed = "nxml.analyse:TextEmbeddings"
nsfw = "nxml.analyse:NsfwDetector"
age = "nxml.analyse:AgeAndGenderRunner"
clip = "nxml.analyse:ClipEmbeddings"
textblob = "nxml.analyse:TextBlobRunner"
opencode = "nxml.agents:OpenCodeAgent"
librosa = "nxml.audio:LibRosa"
image_similarity = "nxml.image:ImageSimilarity"
speech_reg = "nxml.audio:CommandRecognition"
qa = "nxml.nlp:QuestionAnswering"
text_classifier = "nxml.nlp:TextClassifier"
ai_text = "nxml.nlp:AiTextDetector"
ttt = "nxml.nlp:TextToText"
tw = "nxml.nlp:TextWorker"
od = "nxml.image:ObjectDetector"
ic = "nxml.image:ImageClassifier"
fingerprint = "nxml.image:ImageFingerprint"
aesthetics = "nxml.image:Aesthetics"
depth = "nxml.image:DepthEstimation"
ocr = "nxml.image:OCR"
ocrai = "nxml.image:OcrAi"
document = "nxml.image:DocumentAnalysis"
document_dockered = "nxml.image:DocumentAnalysisDockerd"
video_ocr = "nxml.video.ocr:VideoOcr"
summarize = "nxml.nlp:TextSummarization"
mail_respond = "nxml.nlp:MailRespond"
jeff = "nxml.nlp:Jeff"
prompt_edit = "nxml.prompt_edit:PromptEditor"
order_extract = "nxml.order_extract:OrderExtractor"
rag = "nxml.rag:RagRunner"


llmqueue = "nxml.llm:LlmQueue"
lmstudio = "nxml.llm:LMStudio"
rllm = "nxml.llm:RLLM"
ollm = "nxml.llm:OLLama"
ollmd = "nxml.llm:OLLamaDockerd"
gptllm = "nxml.llm:OpenAiLLM"
cohere = "nxml.llm:CohereLlm"
gemini = "nxml.llm:Gemini"
remote_lmstudio = "nxml.remote.llm:RemoteLmStudio"
remote_comfy = "nxml.remote.comfy:RemoteComfy"
remote_opencode = "nxml.remote.opencode:RemoteOpenCode"

vision = "nxml.llm:Vision"
tt = "nxml.llm:TransformText"
llmproxy = "nxml.proxy:LlmProxy"

whisper = "nxml.analyse:Whisper"
tts = "nxml.audio:ElevenLabs"
qtts = "nxml.tts:Qwen3TTS"
heartmula = "nxml.music:HeartMuLa"
pipertts = "nxml.audio:PiperTTS"
face_similarity = "nxml.vision.face:FaceSimilarity"
slam = "nxml.vision.slam:SlamRunner"
pointcloud = "nxml.vision.pointcloud:PointCloudRunner"
worldmirror = "nxml.vision.worldmirror:WorldMirror"
bon = "nxml.vision.ocr:BonReader"
deepseek_ocr = "nxml.vision.ocr:DeepSeekOcr"
comfyui = "nxml.comfyui:ComfyUi"
imap = "nxml.data:Imap"

[tool.setuptools]
packages = ["nxml", "nxml.rag", "nxml.video", "nxml.remote", "nxml.comfyui", "nxml.vision"]
include-package-data = true

[tool.setuptools.package-data]
nxml = ["docker/*"]
